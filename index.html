
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join With Us!</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    padding: 25px;
}

h1 {
    color: #222;
    font-size: clamp(25px, 5vw, 36px);
    margin-bottom: 35px;
}

button {
    background: #2785ed;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 15px 55px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #1266c7;
    transform: scale(1.05);
}

button:disabled {
    background: #75afe9;
    cursor: default;
    transform: none;
}

#message {
    display: none;
    color: #2785ed;
    font-size: 21px;
    font-weight: bold;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

    <h1>Click the button to join with us</h1>

    <button id="joinButton" onclick="joinUs()">
        JOIN
    </button>

    <p id="message">
        thank you so much^•^
    </p>

</div>

<script>
function joinUs() {
    const button = document.getElementById("joinButton");
    const message = document.getElementById("message");

    button.textContent = "JOINED";
    button.disabled = true;

    message.style.display = "block";
}
</script>

</body>
</html>
